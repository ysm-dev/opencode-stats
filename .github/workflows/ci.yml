name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Proves the template is still green when nobody has touched it.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    name: Source gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # Vitest requires Node >= 22.12 and does not support the bun runtime with
      # the v8 coverage provider. bun installs and runs scripts; Node runs tests.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # A clean checkout is always a clean tree. bun's isolated installs are not
      # pruned incrementally, so a stale local node_modules can hide a removed
      # dependency that fails here.
      - run: bun install --frozen-lockfile
      - run: bun run ci:checks
        env:
          GITHUB_TOKEN: ${{ github.token }}

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      # Authoritative full run on every PR; no incremental cache.
      - run: bun run mutate

  verification:
    name: Gate verification
    needs: [checks, mutation, contracts, packed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      # Plants source and changes configs: must be last, in its own checkout.
      - run: bun run verify-gates

  contracts:
    name: Bun contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
      # The inactive-WAL contract uses the pinned-schema Node fixture writer,
      # then runs the real readonly reader and sync worker on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bun run contracts

  packed:
    name: Packed tarball (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/e2e playwright install --with-deps chromium
      - run: bun run release
      - run: bun run bundle:check
      - run: bun run e2e

  gates:
    name: Quality gates
    needs: [checks, mutation, contracts, verification, packed]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Keep the ruleset's existing required check meaningful even if a job skips.
      - run: test "$CHECKS" = success && test "$MUTATION" = success && test "$CONTRACTS" = success && test "$VERIFICATION" = success && test "$PACKED" = success
        env:
          CHECKS: ${{ needs.checks.result }}
          MUTATION: ${{ needs.mutation.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          VERIFICATION: ${{ needs.verification.result }}
          PACKED: ${{ needs.packed.result }}
