name: Synthetic input clocks (research only)

on:
  push:
    branches: [research/perf-measurement]
    paths:
      - .github/workflows/perf-measurement.yml
      - scripts/perf-measurement*.mjs
      - docs/research/perf-measurement.html

permissions:
  contents: read

jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Throwaway browser installation
        run: |
          npm install --prefix "$RUNNER_TEMP/perf-deps" playwright@1.63.0
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/perf-browsers" "$RUNNER_TEMP/perf-deps/node_modules/.bin/playwright" install --with-deps chromium webkit firefox
      - name: Measure synthetic pages
        env:
          PM_DEPS: ${{ runner.temp }}/perf-deps/node_modules
          PM_OUT: ${{ runner.temp }}/perf-report.json
          PM_CORE: "1"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/perf-browsers
        run: node scripts/perf-measurement.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: ${{ runner.temp }}/perf-report.json
          retention-days: 7
